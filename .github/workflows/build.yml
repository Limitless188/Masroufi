name: Build Masroufi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q Masroufi_AutoBank_v4_FINAL.zip -d project

      - name: Find Gradle project
        run: |
          find project -name gradlew -type f -exec chmod +x {} \;

      - name: Build APK
        working-directory: project
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masroufi-APK
          path: project/**/build/outputs/apk/**/*.apk
