name: Build Masroufi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q Masroufi_AutoBank_v4_FINAL.zip -d project

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find project -maxdepth 5 -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print

      - name: Find Gradle wrapper
        id: gradle
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -1 || true)

          if [ -n "$GRADLEW" ]; then
            echo "Found Gradle wrapper: $GRADLEW"
            chmod +x "$GRADLEW"

            PROJECT_DIR=$(dirname "$GRADLEW")
            echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo "use_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "Gradle wrapper not found."
            echo "use_wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle
        if: steps.gradle.outputs.use_wrapper == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Fix JVM target compatibility
        working-directory: ${{ steps.gradle.outputs.project_dir || 'project' }}
        run: |
          cat > fix-jvm.gradle <<'EOF'
          allprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "1.8"
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: ${{ steps.gradle.outputs.project_dir || 'project' }}
        run: |
          if [ "${{ steps.gradle.outputs.use_wrapper }}" = "true" ]; then
            ./gradlew assembleDebug --stacktrace -I fix-jvm.gradle
          else
            gradle assembleDebug --stacktrace -I fix-jvm.gradle
          fi

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masroufi-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
